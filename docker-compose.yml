services:
  postgres:
    image: postgres:15
    container_name: blinkr_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: blinkr_identity
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: blinkr_pgadmin
    restart: always
    platform: linux/amd64
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: Admin1234!
    ports:
      - "5050:80"
    depends_on:
      - postgres

  seq:
    image: datalust/seq:latest
    container_name: blinkr_seq
    restart: always
    platform: linux/amd64
    environment:
      - ACCEPT_EULA=Y
    ports:
      - "5341:80"
    volumes:
      - seq_data:/data
   
  redis:
    image: redis:7
    container_name: blinkr_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  seq_data:
  redis_data:
